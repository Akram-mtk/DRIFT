# Render Blueprint — create the service from this file instead of filling in
# the dashboard by hand. Render > New > Blueprint, point it at this repo.
#
# The database is Supabase, not Render Postgres, so DATABASE_URL is not defined
# here: it is a secret and is set once in the Render dashboard (sync: false).
services:
  - type: web
    name: drift-api
    runtime: node
    plan: free
    # Repo root, not apps/api: npm workspaces need the root install.
    #
    # --include=dev is required, not optional: NODE_ENV=production below makes
    # npm omit devDependencies, and the build needs the Nest CLI and prisma,
    # both of which live there.
    #
    # migrate deploy runs here rather than as a preDeployCommand because
    # pre-deploy commands are not available on the free instance type. It means
    # migrations apply while the old code is still serving, so keep them
    # additive (add columns/tables, don't drop what the running code reads).
    buildCommand: >-
      npm ci --include=dev &&
      npx prisma generate --config apps/api/prisma.config.ts &&
      npm run build -w api &&
      npx prisma migrate deploy --config apps/api/prisma.config.ts
    startCommand: node apps/api/dist/main
    healthCheckPath: /api/health
    envVars:
      # Supabase connection string — set in the dashboard, never committed.
      # Use the connection *pooler* host (…pooler.supabase.com), not
      # db.<ref>.supabase.co: the direct host resolves to IPv6 only and Render
      # has no IPv6 egress, so a direct URL fails to connect at all.
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
