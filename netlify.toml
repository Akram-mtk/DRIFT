[build]
  command = "npm run build -w web"
  publish = "apps/web/dist"

# The redirects live in apps/web/public/_redirects, not here: Vite copies that
# file into dist/, so the rules travel with the built output and apply whether
# the site is deployed from git or by dragging dist/ into Netlify. Rules in
# this file would only work for the former.
